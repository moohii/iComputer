<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>احجز موعد | iComputer Urban Tech DZ</title>
  <meta name="description" content="احجز موعدًا للدعم التقني، صيانة الحواسيب، أو خدمات الشبكات في iComputer Urban Tech DZ." />
  <meta name="canonical" content="https://[your-domain]/booking.html" />
  <meta property="og:title" content="احجز موعد | iComputer Urban Tech DZ" />
  <meta property="og:description" content="احجز موعدًا للدعم التقني وصيانة الحواسيب في القصبة، الجزائر العاصمة." />
  <meta property="og:url" content="https://[your-domain]/booking.html" />
  <meta name="robots" content="index,follow" />
  <script src="js/theme.js"></script>
  <link rel="icon" href="images/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/scroll3d.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <header class="navbar glass">
    <div class="container nav-inner">
      <a href="index.html" class="brand">
        <img src="images/logo1.png" alt="iComputer Logo" class="brand-logo" onerror="this.style.display='none'" />
        <span class="brand-mark">iC</span>
        <span class="brand-text">iComputer <em>Urban Tech DZ</em></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html#home" data-i18n="nav.home">الرئيسية</a>
        <a href="booking.html" data-i18n="nav.booking">احجز موعد</a>
        <a href="services.html" data-i18n="nav.services">الخدمات</a>
        <a href="index.html#contact" data-i18n="nav.contact">تواصل</a>
      </nav>
      <div class="nav-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button data-lang="ar" class="active">ع</button>
          <button data-lang="fr">FR</button>
          <button data-lang="en">EN</button>
        </div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="تبديل الوضع اللوني">☼</button>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="فتح القائمة" aria-controls="navLinks" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main>
    <section class="section booking-page">
      <div class="container booking-shell">
        <div class="booking-copy">
          <span class="chip glass" data-i18n="booking.title">احجز موعدك</span>
          <h1 data-i18n="booking.title">احجز موعدك</h1>
          <p data-i18n="booking.subtitle">اختر الخدمة المناسبة لك وسنقوم بالتواصل معك قريبًا.</p>
          <ul class="booking-benefits">
            <li>🎧 دعم فني متخصص</li>
            <li>🔒 حماية البيانات والنسخ الاحتياطي</li>
            <li>📍 خدمة في القصبة والجزائر العاصمة</li>
          </ul>
        </div>

        <form class="booking-form glass" name="booking" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
          <input type="hidden" name="form-name" value="booking" />
          <p class="hidden-field">
            <label>لا تملأ هذا الحقل <input name="bot-field" /></label>
          </p>

          <div class="form-field">
            <label for="bookingName" data-i18n="booking.name">الاسم</label>
            <input id="bookingName" name="name" type="text" placeholder="أدخل اسمك" required />
          </div>

          <div class="form-field">
            <label for="bookingPhone" data-i18n="booking.phone">الهاتف / WhatsApp</label>
            <input id="bookingPhone" name="phone" type="tel" inputmode="tel" placeholder="+213 000 000 000" required />
          </div>

          <div class="form-field">
            <label for="bookingService" data-i18n="booking.service">الخدمة</label>
            <select id="bookingService" name="service" required>
              <option value="" data-i18n="booking.serviceOption">اختر الخدمة</option>
              <option value="دعم الحاسوب والبرامج">دعم الحاسوب والبرامج</option>
              <option value="تركيب الشبكات">تركيب الشبكات</option>
              <option value="الأمن السيبراني">الأمن السيبراني</option>
              <option value="إنشاء السيرة الذاتية">إنشاء السيرة الذاتية</option>
              <option value="تصميم عروض PowerPoint">تصميم عروض PowerPoint</option>
              <option value="كتابة التقارير أو المشاريع">كتابة التقارير أو المشاريع</option>
              <option value="إعداد جداول Excel">إعداد جداول Excel</option>
            </select>
          </div>

          <div class="form-field">
            <label for="bookingDate" data-i18n="booking.date">اليوم</label>
            <input id="bookingDate" name="date" type="date" required />
          </div>

          <div class="form-field">
            <label for="bookingPeriod" data-i18n="booking.period">الفترة</label>
            <select id="bookingPeriod" name="period" required>
              <option value="" data-i18n="booking.periodOption">اختر الفترة</option>
              <option value="صباحًا">صباحًا</option>
              <option value="بعد الظهر">بعد الظهر</option>
              <option value="مساءً">مساءً</option>
            </select>
          </div>

          <div class="form-field form-field-full">
            <label for="bookingProblem" data-i18n="booking.description">وصف المشكلة (اختياري)</label>
            <textarea id="bookingProblem" name="problem" rows="5" placeholder="أخبرنا باختصار عن المشكلة"></textarea>
          </div>

          <button type="submit" class="btn btn-primary" data-i18n="booking.submit">إرسال الطلب</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer glass">
    <div class="container footer-inner">
      <p>© <span id="year"></span> iComputer Urban Tech DZ — <span data-i18n="footer.rights">جميع الحقوق محفوظة</span></p>
    </div>
  </footer>

  <a class="floating-whatsapp" href="https://wa.me/rai.med.elamine?text=مرحبًا،%20أرغب%20في%20الاستفسار%20عن%20خدمات%20iComputer." target="_blank" rel="noopener" aria-label="WhatsApp" data-whatsapp-link>
    <span aria-hidden="true">💬</span>
  </a>

  <script src="js/script.js"></script>
  <script src="js/scroll3d.js" data-auto="main img, section img"></script>
</body>
</html>
