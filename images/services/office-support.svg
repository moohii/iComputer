<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Office IT support dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1622"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132033"/>
      <stop offset="1" stop-color="#0C1522"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4D9EFF"/>
      <stop offset="1" stop-color="#63D6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4D9EFF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4D9EFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#27405E" stroke-opacity=".28"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <ellipse cx="430" cy="250" rx="300" ry="200" fill="url(#glow)"/>
  <circle cx="660" cy="110" r="90" fill="#4D9EFF" opacity=".12" filter="url(#blur)"/>

  <!-- depth panel -->
  <rect x="196" y="132" width="452" height="314" rx="24" fill="#0A121D" stroke="#1B2C42" stroke-width="1.5" transform="translate(12 14)"/>

  <!-- main window -->
  <rect x="180" y="116" width="452" height="314" rx="24" fill="url(#screen)" stroke="#2B4564" stroke-width="1.5"/>
  <path d="M180 160h452" stroke="#22354C" stroke-width="1.5"/>
  <circle cx="208" cy="138" r="4.5" fill="#F07A7A" opacity=".8"/>
  <circle cx="224" cy="138" r="4.5" fill="#F0B45A" opacity=".85"/>
  <circle cx="240" cy="138" r="4.5" fill="#3DDC97" opacity=".85"/>
  <rect x="268" y="131" width="108" height="14" rx="7" fill="#1B2B40"/>

  <!-- sidebar -->
  <rect x="200" y="180" width="118" height="226" rx="14" fill="#0D1726" stroke="#22354C"/>
  <rect x="214" y="198" width="72" height="9" rx="4.5" fill="#3D5878"/>
  <rect x="214" y="220" width="88" height="8" rx="4" fill="#22354C"/>
  <rect x="214" y="240" width="66" height="8" rx="4" fill="#22354C"/>
  <rect x="214" y="260" width="80" height="8" rx="4" fill="#22354C"/>
  <rect x="214" y="292" width="90" height="34" rx="9" fill="#17304C" stroke="#2B5A8C"/>
  <circle cx="232" cy="309" r="7" fill="none" stroke="#4D9EFF" stroke-width="2"/>
  <rect x="246" y="305" width="44" height="8" rx="4" fill="#4D9EFF" opacity=".7"/>

  <!-- task rows -->
  <g>
    <rect x="334" y="182" width="276" height="58" rx="12" fill="#111D2D" stroke="#22354C"/>
    <circle cx="362" cy="211" r="13" fill="#123526" stroke="#2E8C63"/>
    <path d="m356 211 4 4 8-9" fill="none" stroke="#3DDC97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="386" y="198" width="118" height="10" rx="5" fill="#7994B3"/>
    <rect x="386" y="216" width="78" height="7" rx="3.5" fill="#334A66"/>
    <rect x="556" y="202" width="34" height="18" rx="9" fill="#17304C"/>
    <rect x="564" y="208" width="18" height="6" rx="3" fill="#4D9EFF" opacity=".8"/>
  </g>
  <g>
    <rect x="334" y="250" width="276" height="58" rx="12" fill="#111D2D" stroke="#22354C"/>
    <circle cx="362" cy="279" r="13" fill="#123526" stroke="#2E8C63"/>
    <path d="m356 279 4 4 8-9" fill="none" stroke="#3DDC97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="386" y="266" width="142" height="10" rx="5" fill="#7994B3"/>
    <rect x="386" y="284" width="94" height="7" rx="3.5" fill="#334A66"/>
    <rect x="556" y="270" width="34" height="18" rx="9" fill="#17304C"/>
    <rect x="564" y="276" width="18" height="6" rx="3" fill="#4D9EFF" opacity=".8"/>
  </g>
  <g>
    <rect x="334" y="318" width="276" height="58" rx="12" fill="#111D2D" stroke="#22354C"/>
    <circle cx="362" cy="347" r="13" fill="#2B2312" stroke="#8C6A2E"/>
    <path d="M362 341v7l5 3" fill="none" stroke="#F0B45A" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="386" y="334" width="102" height="10" rx="5" fill="#7994B3"/>
    <rect x="386" y="352" width="66" height="7" rx="3.5" fill="#334A66"/>
    <rect x="556" y="338" width="34" height="18" rx="9" fill="#2B2312"/>
    <rect x="564" y="344" width="18" height="6" rx="3" fill="#F0B45A" opacity=".85"/>
  </g>

  <!-- bottom status -->
  <rect x="334" y="390" width="276" height="12" rx="6" fill="#1B2B40"/>
  <rect x="334" y="390" width="212" height="12" rx="6" fill="url(#accent)" opacity=".85"/>

  <!-- floating support badge -->
  <g>
    <rect x="86" y="330" width="132" height="96" rx="20" fill="#101B2A" stroke="#2B4564" stroke-width="1.5"/>
    <circle cx="152" cy="365" r="21" fill="#16324F" stroke="#4D9EFF" stroke-opacity=".7"/>
    <path d="M141 367a11 11 0 0 1 22 0" fill="none" stroke="#4D9EFF" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="139" y="366" width="6" height="12" rx="3" fill="#4D9EFF"/>
    <rect x="159" y="366" width="6" height="12" rx="3" fill="#4D9EFF"/>
    <rect x="128" y="398" width="48" height="8" rx="4" fill="#4D9EFF" opacity=".55"/>
  </g>

  <!-- floating check card -->
  <g>
    <rect x="620" y="300" width="104" height="72" rx="18" fill="#0F1D2A" stroke="#2B4564" stroke-width="1.5"/>
    <circle cx="672" cy="329" r="16" fill="#123526" stroke="#2E8C63"/>
    <path d="m665 329 5 5 9-10" fill="none" stroke="#3DDC97" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="648" y="353" width="48" height="7" rx="3.5" fill="#3D5878"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="430" cy="462" rx="250" ry="22" fill="#000" opacity=".45" filter="url(#blur)"/>
</svg>
