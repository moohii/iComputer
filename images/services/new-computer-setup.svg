<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="New computer setup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1623"/>
      <stop offset="1" stop-color="#070B11"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162A44"/>
      <stop offset="1" stop-color="#0B1420"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2D42"/>
      <stop offset="1" stop-color="#101B2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D9EFF"/>
      <stop offset="1" stop-color="#63D6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#63D6FF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#63D6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#27405E" stroke-opacity=".26"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <ellipse cx="400" cy="280" rx="320" ry="220" fill="url(#glow)"/>

  <!-- laptop -->
  <rect x="242" y="118" width="316" height="226" rx="16" fill="url(#body)" stroke="#35506F" stroke-width="2"/>
  <rect x="258" y="134" width="284" height="194" rx="9" fill="url(#screen)"/>

  <!-- windows mark -->
  <g fill="url(#accent)">
    <rect x="298" y="174" width="38" height="38" rx="7" opacity=".95"/>
    <rect x="344" y="174" width="38" height="38" rx="7" opacity=".7"/>
    <rect x="298" y="220" width="38" height="38" rx="7" opacity=".7"/>
    <rect x="344" y="220" width="38" height="38" rx="7" opacity=".45"/>
  </g>

  <rect x="404" y="180" width="104" height="10" rx="5" fill="#7994B3"/>
  <rect x="404" y="202" width="74" height="7" rx="3.5" fill="#334A66"/>
  <rect x="404" y="230" width="108" height="8" rx="4" fill="#1B2B40"/>
  <rect x="404" y="230" width="70" height="8" rx="4" fill="#3DDC97"/>
  <rect x="404" y="254" width="84" height="7" rx="3.5" fill="#334A66"/>

  <!-- laptop base -->
  <path d="M204 344h392l34 30c4 4 1 10-5 10H175c-6 0-9-6-5-10z" fill="#172538" stroke="#35506F" stroke-width="2"/>
  <rect x="364" y="352" width="72" height="7" rx="3.5" fill="#0B1420"/>

  <!-- checklist card -->
  <g>
    <rect x="566" y="236" width="170" height="158" rx="20" fill="#0F1B29" stroke="#35506F" stroke-width="1.5"/>
    <rect x="588" y="260" width="82" height="9" rx="4.5" fill="#7994B3"/>
    <g>
      <circle cx="596" cy="294" r="9" fill="#123526" stroke="#2E8C63"/>
      <path d="m592 294 3 3 6-7" fill="none" stroke="#3DDC97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="614" y="290" width="88" height="7" rx="3.5" fill="#3D5878"/>
    </g>
    <g>
      <circle cx="596" cy="322" r="9" fill="#123526" stroke="#2E8C63"/>
      <path d="m592 322 3 3 6-7" fill="none" stroke="#3DDC97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="614" y="318" width="74" height="7" rx="3.5" fill="#3D5878"/>
    </g>
    <g>
      <circle cx="596" cy="350" r="9" fill="#123526" stroke="#2E8C63"/>
      <path d="m592 350 3 3 6-7" fill="none" stroke="#3DDC97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="614" y="346" width="96" height="7" rx="3.5" fill="#3D5878"/>
    </g>
    <rect x="588" y="370" width="126" height="7" rx="3.5" fill="#1B2B40"/>
    <rect x="588" y="370" width="92" height="7" rx="3.5" fill="#4D9EFF" opacity=".7"/>
  </g>

  <!-- sparkles -->
  <g fill="#63D6FF" opacity=".8">
    <path d="M606 106l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
    <path d="M116 208l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".6"/>
    <path d="M690 132l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" opacity=".5"/>
  </g>

  <ellipse cx="400" cy="422" rx="230" ry="18" fill="#000" opacity=".45" filter="url(#blur)"/>
</svg>
