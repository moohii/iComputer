<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Office network and Wi-Fi setup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1522"/>
      <stop offset="1" stop-color="#070B11"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20344C"/>
      <stop offset="1" stop-color="#111D2B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D9EFF"/>
      <stop offset="1" stop-color="#3DDC97"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4D9EFF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#4D9EFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#27405E" stroke-opacity=".26"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <ellipse cx="400" cy="270" rx="330" ry="230" fill="url(#glow)"/>

  <!-- connection lines -->
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".65">
    <path d="M400 332 232 196"/>
    <path d="M400 332 568 196"/>
    <path d="M400 332 190 384"/>
    <path d="M400 332 610 384"/>
    <path d="M400 332 400 150"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="232" cy="196" r="34" fill="#0F1B29" stroke="#35506F" stroke-width="2"/>
    <rect x="216" y="186" width="32" height="22" rx="4" fill="none" stroke="#4D9EFF" stroke-width="2"/>
    <path d="M232 208v8M224 216h16" stroke="#4D9EFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="568" cy="196" r="34" fill="#0F1B29" stroke="#35506F" stroke-width="2"/>
    <rect x="552" y="184" width="32" height="26" rx="4" fill="none" stroke="#4D9EFF" stroke-width="2"/>
    <path d="M560 194h16M560 201h10" stroke="#4D9EFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="190" cy="384" r="34" fill="#0F1B29" stroke="#35506F" stroke-width="2"/>
    <rect x="174" y="376" width="32" height="18" rx="3" fill="none" stroke="#3DDC97" stroke-width="2"/>
    <path d="M180 394v6h20v-6" fill="none" stroke="#3DDC97" stroke-width="2"/>
  </g>
  <g>
    <circle cx="610" cy="384" r="34" fill="#0F1B29" stroke="#35506F" stroke-width="2"/>
    <rect x="598" y="372" width="24" height="28" rx="3" fill="none" stroke="#3DDC97" stroke-width="2"/>
    <path d="M604 372v-4h12v4" fill="none" stroke="#3DDC97" stroke-width="2"/>
  </g>
  <g>
    <circle cx="400" cy="150" r="30" fill="#0F1B29" stroke="#35506F" stroke-width="2"/>
    <path d="M388 154a17 17 0 0 1 24 0M394 160a9 9 0 0 1 12 0M399 166h2" fill="none" stroke="#4D9EFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- router -->
  <g>
    <ellipse cx="400" cy="412" rx="150" ry="26" fill="#000" opacity=".4" filter="url(#blur)"/>
    <rect x="286" y="320" width="228" height="72" rx="18" fill="url(#router)" stroke="#3A587A" stroke-width="2"/>
    <rect x="314" y="342" width="96" height="9" rx="4.5" fill="#4D9EFF" opacity=".85"/>
    <rect x="314" y="361" width="58" height="7" rx="3.5" fill="#3D5878"/>
    <circle cx="470" cy="352" r="5" fill="#3DDC97"/>
    <circle cx="470" cy="369" r="5" fill="#3DDC97" opacity=".55"/>
    <path d="M318 320v-34M482 320v-34" stroke="#3A587A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="318" cy="282" r="4" fill="#4D9EFF"/>
    <circle cx="482" cy="282" r="4" fill="#4D9EFF"/>
  </g>

  <!-- packets -->
  <rect x="304" y="248" width="10" height="10" rx="3" fill="#3DDC97" opacity=".9"/>
  <rect x="486" y="262" width="10" height="10" rx="3" fill="#4D9EFF" opacity=".9"/>
  <rect x="294" y="408" width="10" height="10" rx="3" fill="#4D9EFF" opacity=".7"/>

  <!-- status card -->
  <g>
    <rect x="606" y="84" width="140" height="70" rx="18" fill="#0F1B29" stroke="#35506F" stroke-width="1.5"/>
    <circle cx="634" cy="119" r="10" fill="#123526" stroke="#2E8C63"/>
    <circle cx="634" cy="119" r="3.5" fill="#3DDC97"/>
    <rect x="654" y="108" width="70" height="8" rx="4" fill="#7994B3"/>
    <rect x="654" y="124" width="46" height="6" rx="3" fill="#334A66"/>
  </g>
</svg>
