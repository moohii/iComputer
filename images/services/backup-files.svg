<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Backup and data protection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1521"/>
      <stop offset="1" stop-color="#070B11"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B314C"/>
      <stop offset="1" stop-color="#102033"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C3A5A"/>
      <stop offset="1" stop-color="#0F2236"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3DDC97" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#27405E" stroke-opacity=".26"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <ellipse cx="400" cy="280" rx="320" ry="220" fill="url(#glow)"/>

  <!-- database stack -->
  <g>
    <ellipse cx="356" cy="388" rx="150" ry="38" fill="#0A121C" stroke="#2A4059" stroke-width="1.5"/>
    <path d="M206 388v-58c0-21 67-38 150-38s150 17 150 38v58" fill="url(#disk)" stroke="#35506F" stroke-width="1.5"/>
    <ellipse cx="356" cy="330" rx="150" ry="38" fill="#16293F" stroke="#35506F" stroke-width="1.5"/>
    <ellipse cx="356" cy="330" rx="112" ry="24" fill="#0D1A29" stroke="#27405E"/>

    <path d="M206 388v-116c0-21 67-38 150-38s150 17 150 38v116" fill="url(#disk)" stroke="#35506F" stroke-width="1.5" opacity=".92"/>
    <ellipse cx="356" cy="272" rx="150" ry="38" fill="#18304A" stroke="#3A587A" stroke-width="1.5"/>
    <ellipse cx="356" cy="272" rx="112" ry="24" fill="#0D1A29" stroke="#27405E"/>

    <path d="M206 272v-58c0-21 67-38 150-38s150 17 150 38v58" fill="url(#disk)" stroke="#35506F" stroke-width="1.5"/>
    <ellipse cx="356" cy="214" rx="150" ry="38" fill="#1B3552" stroke="#3A587A" stroke-width="1.5"/>
    <ellipse cx="356" cy="214" rx="112" ry="24" fill="#0D1A29" stroke="#27405E"/>
    <circle cx="356" cy="214" r="7" fill="#3DDC97"/>
  </g>

  <!-- shield -->
  <g transform="translate(526 150)">
    <path d="M72 0 144 26v62c0 54-42 92-72 112C42 180 0 142 0 88V26z" fill="url(#shield)" stroke="#4D9EFF" stroke-opacity=".65" stroke-width="2"/>
    <path d="M40 80l22 22 44-48" fill="none" stroke="#3DDC97" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sync arrows -->
  <g fill="none" stroke="#4D9EFF" stroke-width="2.5" stroke-linecap="round" opacity=".8">
    <path d="M124 226a66 66 0 0 1 92-58"/>
    <path d="M216 168l2 22-22-2"/>
    <path d="M232 306a66 66 0 0 1-92 58"/>
    <path d="M140 364l-2-22 22 2"/>
  </g>

  <!-- status card -->
  <g>
    <rect x="96" y="120" width="156" height="66" rx="18" fill="#0F1B29" stroke="#35506F" stroke-width="1.5"/>
    <circle cx="124" cy="153" r="9" fill="#123526" stroke="#2E8C63"/>
    <circle cx="124" cy="153" r="3.2" fill="#3DDC97"/>
    <rect x="144" y="142" width="80" height="8" rx="4" fill="#7994B3"/>
    <rect x="144" y="158" width="52" height="6" rx="3" fill="#334A66"/>
  </g>

  <ellipse cx="380" cy="452" rx="210" ry="18" fill="#000" opacity=".45" filter="url(#blur)"/>
</svg>
