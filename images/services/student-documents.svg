<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Student thesis and report formatting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1623"/>
      <stop offset="1" stop-color="#070B11"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F5FB"/>
      <stop offset="1" stop-color="#C6D4E3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D9EFF"/>
      <stop offset="1" stop-color="#63D6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#63D6FF" stop-opacity=".26"/>
      <stop offset="1" stop-color="#63D6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#27405E" stroke-opacity=".26"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#grid)"/>
  <ellipse cx="400" cy="280" rx="320" ry="220" fill="url(#glow)"/>

  <!-- back pages -->
  <g transform="rotate(-8 360 290)">
    <rect x="236" y="118" width="248" height="332" rx="12" fill="url(#paper)" opacity=".26"/>
  </g>
  <g transform="rotate(5 380 290)">
    <rect x="256" y="106" width="248" height="332" rx="12" fill="url(#paper)" opacity=".45"/>
  </g>

  <!-- main page -->
  <g transform="rotate(-1 400 290)">
    <rect x="272" y="92" width="256" height="346" rx="12" fill="url(#paper)"/>
    <rect x="272" y="92" width="256" height="346" rx="12" fill="none" stroke="#9FB4C9"/>

    <!-- header -->
    <rect x="302" y="124" width="122" height="10" rx="5" fill="#33506F"/>
    <rect x="302" y="144" width="82" height="7" rx="3.5" fill="#8FA6BC"/>

    <!-- TOC -->
    <rect x="302" y="178" width="56" height="7" rx="3.5" fill="url(#accent)"/>
    <rect x="302" y="196" width="168" height="5" rx="2.5" fill="#AFC0D1"/>
    <rect x="302" y="210" width="142" height="5" rx="2.5" fill="#AFC0D1"/>
    <rect x="302" y="224" width="156" height="5" rx="2.5" fill="#AFC0D1"/>

    <!-- body -->
    <rect x="302" y="252" width="68" height="7" rx="3.5" fill="url(#accent)"/>
    <g fill="#AFC0D1">
      <rect x="302" y="272" width="188" height="5" rx="2.5"/>
      <rect x="302" y="286" width="196" height="5" rx="2.5"/>
      <rect x="302" y="300" width="174" height="5" rx="2.5"/>
      <rect x="302" y="314" width="188" height="5" rx="2.5"/>
      <rect x="302" y="328" width="148" height="5" rx="2.5"/>
    </g>
    <g fill="#8FA6BC">
      <rect x="302" y="352" width="182" height="5" rx="2.5"/>
      <rect x="302" y="366" width="160" height="5" rx="2.5"/>
      <rect x="302" y="380" width="190" height="5" rx="2.5"/>
      <rect x="302" y="394" width="132" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- graduation cap -->
  <g transform="translate(548 116)">
    <path d="M62 0 124 28 62 56 0 28z" fill="#14263B" stroke="#4D9EFF" stroke-width="2"/>
    <path d="M24 40v30c0 10 17 18 38 18s38-8 38-18V40" fill="#0F1D2E" stroke="#4D9EFF" stroke-width="2"/>
    <path d="M124 28v40" stroke="#3DDC97" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="124" cy="72" r="5" fill="#3DDC97"/>
  </g>

  <!-- PDF badge -->
  <g>
    <rect x="116" y="336" width="152" height="58" rx="16" fill="#0F1B29" stroke="#35506F" stroke-width="1.5"/>
    <rect x="134" y="352" width="42" height="26" rx="6" fill="#4D9EFF" opacity=".9"/>
    <path d="M146 352v10l7-4 7 4v-10" fill="none" stroke="#0B1420" stroke-width="2" stroke-linejoin="round"/>
    <rect x="188" y="354" width="54" height="8" rx="4" fill="#7994B3"/>
    <rect x="188" y="370" width="36" height="6" rx="3" fill="#334A66"/>
  </g>

  <!-- check card -->
  <g>
    <rect x="606" y="318" width="122" height="76" rx="18" fill="#0F1B29" stroke="#35506F" stroke-width="1.5"/>
    <circle cx="638" cy="346" r="13" fill="#123526" stroke="#2E8C63"/>
    <path d="m632 346 4 4 8-9" fill="none" stroke="#3DDC97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="660" y="338" width="48" height="7" rx="3.5" fill="#7994B3"/>
    <rect x="660" y="352" width="34" height="6" rx="3" fill="#334A66"/>
    <rect x="626" y="372" width="84" height="6" rx="3" fill="#1B2B40"/>
  </g>

  <ellipse cx="400" cy="470" rx="220" ry="18" fill="#000" opacity=".45" filter="url(#blur)"/>
</svg>
